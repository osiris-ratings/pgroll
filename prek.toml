# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  # `backplane/pgformatter:latest` (used by `make format`/`task format`) emits
  # a trailing blank line on init.sql; end-of-file-fixer would strip it,
  # causing every commit that touches init.sql to thrash. CI is the source
  # of truth — exclude init.sql here.
  { id = "end-of-file-fixer", exclude = "^pkg/state/init\\.sql$" },
  { id = "check-yaml" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/golangci/golangci-lint"
rev = "v2.12.2"
hooks = [
  # `golangci-lint-full` (not `golangci-lint`): the latter passes
  # `--new-from-rev HEAD --fix`, which only flags issues introduced after
  # HEAD and silently skips real ones already in the diff. The full variant
  # lints the whole module exactly like CI does. We pin the same v2.12.2
  # rev CI uses for byte-identical lint behavior, regardless of what version
  # `brew install golangci-lint` happens to ship locally.
  { id = "golangci-lint-full", args = ["--config=.golangci.yml", "--timeout=30m"] },
]

[[repos]]
repo = "https://github.com/dnephin/pre-commit-golang"
rev = "v0.5.1"
hooks = [
  # `go-vet` (not `go-build`): the go-build hook runs `go build ./...`
  # which fails on legitimate test-only packages
  # (internal/benchmarks, internal/jsonschema). go-vet handles those
  # correctly and still catches real compile errors.
  { id = "go-vet" },
  { id = "go-mod-tidy" },
]

# Local hooks — delegate to task targets so the source of truth stays in
# Taskfile.yml. CI runs the same task targets, so each *-clean hook mirrors
# the corresponding CI check (run task target, then fail if working tree
# changed). Without the `&& git diff --quiet` step, hooks would silently
# auto-fix and let CI-failing changes ship.
[[repos]]
repo = "local"
hooks = [
  { id = "task-format-clean", name = "task format produces no diff (mirrors CI format check)", entry = "bash -c 'task format && git diff --quiet'", language = "system", pass_filenames = false, files = "\\.(go|sql|json)$" },
  # cli-definition.json is built from the cobra command tree, so any change
  # under cmd/ can affect it — not just schema.json or build-cli-definition.go.
  { id = "task-generate-clean", name = "task generate produces no diff (mirrors CI code generation check)", entry = "bash -c 'task generate && git diff --quiet -- pkg/migrations/types.go cli-definition.json'", language = "system", pass_filenames = false, files = "^(schema\\.json|tools/build-cli-definition\\.go|cmd/.*\\.go)$" },
  { id = "task-ledger-clean", name = "task ledger produces no diff", entry = "bash -c 'task ledger && git diff --quiet -- examples/.ledger'", language = "system", pass_filenames = false, files = "^examples/" },
  { id = "task-license", name = "task license (SPDX header on .go files)", entry = "bash -c 'task license && git diff --quiet'", language = "system", pass_filenames = false, files = "\\.go$" },
  { id = "task-deadcode", name = "task deadcode (mirrors CI dead code check)", entry = "task deadcode", language = "system", pass_filenames = false, files = "\\.go$" },
]
