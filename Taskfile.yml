version: '3'

tasks:
  install:
    desc: Set up local dev environment (brew deps, Go modules, git hooks)
    preconditions:
      - sh: command -v brew
        msg: "Homebrew is required. Install from https://brew.sh"
    cmds:
      - brew bundle
      - go mod download
      - prek install --overwrite
      - echo "✓ dev environment ready"

  build:
    desc: Build the pgroll binary
    cmds:
      - go build -o ./bin/pgroll .

  clean:
    desc: Remove build artifacts
    cmds:
      - go clean
      - rm -rf ./bin

  test:
    desc: Run tests with coverage
    cmds:
      - go test -cover ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test ./internal/benchmarks -v -benchtime=1x -bench .

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run --config=.golangci.yml

  deadcode:
    desc: Run dead code analysis (matches CI's deadcode check)
    summary: |
      Mirrors the CI `dead code check` job. Runs the deadcode tool from
      golang.org/x/tools via `go run` so it doesn't need to live on PATH,
      and fails when any unreachable function is found across the module
      (including tests).
    cmds:
      - |
        OUT=$(go run golang.org/x/tools/cmd/deadcode@latest --test ./...)
        if [ -n "$OUT" ]; then
          echo "Dead code analysis found the following dead code:"
          echo "$OUT"
          exit 1
        fi

  format:
    desc: Format JSON schema, embedded SQL, and Go sources
    summary: |
      Native counterpart of `make format`. Uses brew-installed prettier and
      pg_format (from the pgformatter formula) instead of Docker, and
      gofumpt for Go sources.
    cmds:
      - prettier schema.json --parser json --tab-width 2 --single-quote --trailing-comma all --no-semi --arrow-parens always --print-width 120 --write
      - pg_format --inplace pkg/state/init.sql
      - gofumpt -w .

  generate:
    desc: Regenerate types from schema.json and the CLI definition
    summary: |
      Mirrors `make generate`. Uses the omissis/go-jsonschema Docker image
      (no Homebrew formula exists), then prepends the SPDX header and
      regenerates cli-definition.json via `go run tools/build-cli-definition.go`.
    cmds:
      - docker run --rm -v $PWD/schema.json:/mnt/schema.json omissis/go-jsonschema:0.17.0 --only-models -p migrations --tags json /mnt/schema.json > pkg/migrations/types.go
      - |
        echo "// SPDX-License-Identifier: Apache-2.0" | cat - pkg/migrations/types.go > pkg/migrations/types.go.tmp
        mv pkg/migrations/types.go.tmp pkg/migrations/types.go
      - go run tools/build-cli-definition.go

  ledger:
    desc: Regenerate examples/.ledger
    dir: examples
    cmds:
      - ls > .ledger

  examples:
    desc: Run all example migrations against a local Postgres
    deps: [ledger]
    cmds:
      - go build
      - ./pgroll init
      - ./pgroll migrate examples --complete
      - go clean

  license:
    desc: Apply the SPDX license header to all .go files
    cmds:
      - |
        if [ ! -f ./bin/license-header-checker ]; then
          curl -s https://raw.githubusercontent.com/lluissm/license-header-checker/master/install.sh | bash
        fi
      - ./bin/license-header-checker -a -r .github/license-header.txt . go

  release:
    desc: Create a new Baselayer release
    summary: |
      Auto-detects the upstream pgroll version (latest vX.Y.Z tag reachable
      from HEAD) and the next baselayer pre-release number, producing a tag
      like v0.16.1-baselayer.3.

      Validates the working tree is clean, updates CHANGELOG.md to stamp
      the [Unreleased] section, commits, tags, and prints push instructions.

      Usage:
        task release
    silent: true
    preconditions:
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "Working tree is not clean. Commit or stash changes first."
      - sh: grep -q '## \[Unreleased\]' CHANGELOG.md
        msg: "CHANGELOG.md has no [Unreleased] section"
    cmds:
      - |
        set -euo pipefail

        # Find the latest upstream tag (vX.Y.Z without pre-release suffix) reachable from HEAD
        UPSTREAM=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD --sort=-v:refname \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
        if [ -z "$UPSTREAM" ]; then
          echo "Error: no upstream vX.Y.Z tag found reachable from HEAD"
          exit 1
        fi

        # Find the next baselayer pre-release number
        LAST=$(git tag --list "${UPSTREAM}-baselayer.*" --sort=-v:refname | head -1)
        if [ -z "$LAST" ]; then
          NEXT=1
        else
          PREV_NUM=${LAST##*baselayer.}
          NEXT=$((PREV_NUM + 1))
        fi

        VERSION="${UPSTREAM#v}-baselayer.${NEXT}"
        TAG="v${VERSION}"

        echo "Upstream base: ${UPSTREAM}"
        echo "Release tag:   ${TAG}"
        echo ""

        # Confirm
        printf "Proceed? [y/N] "
        read -r CONFIRM
        if [ "$CONFIRM" != "y" ] && [ "$CONFIRM" != "Y" ]; then
          echo "Aborted."
          exit 1
        fi

        DATE=$(date +%Y-%m-%d)

        # Stamp CHANGELOG
        python3 -c "
        f=open('CHANGELOG.md'); c=f.read(); f.close()
        c=c.replace('## [Unreleased]','## [Unreleased]\n\n## [${VERSION}] - ${DATE}',1)
        f=open('CHANGELOG.md','w'); f.write(c); f.close()
        "

        # Commit and tag
        git add CHANGELOG.md
        git commit -m "Release ${TAG}"
        git tag -a "${TAG}" -m "Release ${TAG} (based on ${UPSTREAM})"

        echo ""
        echo "Release ${TAG} tagged locally."
        echo "Push to trigger the release workflow:"
        echo ""
        echo "  git push baselayer baselayer --tags"

  release:dry-run:
    desc: Test the release build locally (no publish)
    summary: |
      Validates the goreleaser config and builds the native binary.
      Full cross-platform builds require the goreleaser-cross Docker
      image (used in CI).
    silent: true
    cmds:
      - |
        if ! command -v goreleaser >/dev/null 2>&1; then
          echo "goreleaser not found. Install: brew install goreleaser"
          exit 1
        fi
        echo "Validating goreleaser config..."
        goreleaser check
        echo ""
        echo "Building native binary..."
        go build -o ./bin/pgroll -ldflags "-s -w" .
        echo "Native build successful: ./bin/pgroll"
        ./bin/pgroll --version

  test:homebrew:
    desc: Test installation of the Homebrew package
    cmds:
      - brew tap | grep -q pgroll && brew untap osiris-ratings/pgroll || true
      - brew tap osiris-ratings/pgroll git@github.com:osiris-ratings/pgroll.git
      - HOMEBREW_GITHUB_API_TOKEN=$(gh auth token) brew install osiris-ratings/pgroll/pgroll

  release:test:deb:
    desc: Snapshot-build the .deb via goreleaser-cross and install it in a debian container
    summary: |
      Runs goreleaser --snapshot in the goreleaser-cross Docker image to
      produce .deb artifacts in dist/, then installs the host-arch .deb
      in a debian:stable-slim container to verify packaging end-to-end:
      binary, completions, and the pgroll-update script.

      Requires Docker.
    silent: true
    cmds:
      - |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "docker not found"; exit 1
        fi

        HOST_ARCH=$(uname -m)
        case "$HOST_ARCH" in
          x86_64) DEB_ARCH=amd64 ;;
          aarch64|arm64) DEB_ARCH=arm64 ;;
          *) echo "unsupported host arch: $HOST_ARCH"; exit 1 ;;
        esac

        echo "==> Snapshot build via goreleaser-cross..."
        docker run --rm \
          -v "$PWD:/go/src/pgroll" \
          -w /go/src/pgroll \
          goreleaser/goreleaser-cross:v1.24 \
          release --snapshot --clean --skip=publish

        DEB=$(ls dist/pgroll_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "no .deb produced for ${DEB_ARCH}"; exit 1
        fi
        DEB_NAME=$(basename "$DEB")
        echo "==> Built: $DEB"

        echo "==> Installing in debian:stable-slim..."
        docker run --rm \
          -v "$PWD/dist:/dist:ro" \
          -e DEB_NAME="$DEB_NAME" \
          debian:stable-slim bash -euc '
            apt-get update -qq
            apt-get install -y --no-install-recommends "/dist/$DEB_NAME"
            pgroll --version
            test -f /usr/share/bash-completion/completions/pgroll && echo "bash completion ok"
            test -f /usr/share/zsh/site-functions/_pgroll && echo "zsh completion ok"
            test -x /usr/local/bin/pgroll-update && echo "pgroll-update ok"
          '

        echo "==> .deb verified."
