version: 2

project_name: pgroll

before:
  hooks:
    - go mod tidy

builds:
  - id: pgroll
    binary: pgroll
    flags:
      - -tags=netgo,osusergo
    ldflags:
      - -s -w -X github.com/xataio/pgroll/cmd.Version={{ .Version }}
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CGO_LDFLAGS=-static
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CGO_LDFLAGS=-static
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

brews:
  - repository:
      owner: osiris-ratings
      name: pgroll
    directory: Formula
    homepage: "https://github.com/osiris-ratings/pgroll"
    description: "Postgres zero-downtime migrations made easy"
    license: "Apache-2.0"
    custom_require: custom_download_strategy
    download_strategy: GitHubPrivateRepositoryReleaseDownloadStrategy
    install: |
      bin.install "pgroll"
    test: |
      system "#{bin}/pgroll", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: osiris-ratings
    name: pgroll
